name: Coverage Check

on:
  pull_request:
    branches:
      - main

jobs:
  coverage:
    name: Enforce 85 Percent Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run coverage
        run: python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=85

      - name: Write summary
        if: always()
        run: |
          echo "## Coverage Check" >> "$GITHUB_STEP_SUMMARY"
          echo "Minimum required coverage: 85%" >> "$GITHUB_STEP_SUMMARY"
          echo "Coverage is measured against src." >> "$GITHUB_STEP_SUMMARY"